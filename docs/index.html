    <script>
      // Runs before first paint: apply saved theme + desktop/mobile view (no flash).
      // Theme mirrors src/lib/theme.js. View: if the browser is in "Desktop site" mode on a phone,
      // ask for a 1280px layout so the desktop layout renders (otherwise normal responsive).
      (function () {
        var d = document.documentElement;
        var theme = 'dark';
        try {
          theme = localStorage.getItem('portfolio-theme') === 'light' ? 'light' : 'dark';
        } catch (e) {}
        d.setAttribute('data-theme', theme);
        d.style.colorScheme = theme;
        var tc = document.querySelector('meta[name="theme-color"]');
        if (tc) tc.setAttribute('content', theme === 'light' ? '#f4f7fb' : '#04070c');

        var ua = navigator.userAgent || '';
        var mobileUA = /Mobi|iPhone|iPod|Android.+Mobile/i.test(ua);
        var small = Math.min(screen.width, screen.height) < 700;
        var view = !mobileUA && navigator.maxTouchPoints > 0 && small ? 'desktop' : 'mobile';
        d.setAttribute('data-view', view);
        var vp = document.querySelector('meta[name="viewport"]');
        if (vp) vp.setAttribute('content', view === 'desktop' ? 'width=1280' : 'width=device-width, initial-scale=1.0');
      })();
    </script>
